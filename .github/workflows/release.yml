name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run core tests
        run: dotnet run --project .\VideoUpscaler.Core.Tests\VideoUpscaler.Core.Tests.csproj

      - name: Publish self-contained Windows executable
        run: >-
          dotnet publish .\VideoUpscaler.App\VideoUpscaler.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\artifacts
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .\artifacts\UpscaleStudio4K.exe --title "Upscale Studio 4K $env:GITHUB_REF_NAME" --notes-file .\README.md
        shell: pwsh

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: UpscaleStudio4K-windows-x64
          path: .\artifacts\UpscaleStudio4K.exe
